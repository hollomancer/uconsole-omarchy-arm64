name: Contract tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libarchive-tools libdigest-sha-perl openssh-client
      - name: Run deterministic contract suite
        shell: bash
        run: tests/run-all.sh
