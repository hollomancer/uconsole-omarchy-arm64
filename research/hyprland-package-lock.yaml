failures_recorded:
  - attempt: 1
    result: FAIL
    finding: "The configured root carried an older sync database with aquamarine 0.14.0-1 while the recorded frozen snapshot selected 0.14.0-2."
    smallest_change: "Stop consulting mutable target sync databases during installation; resolve once from the recorded database hashes and require exact local package bytes."
  - attempt: 2
    result: FAIL
    finding: "Pacman 7 DownloadUser=alpm could not apply its Landlock ruleset inside the unprivileged resolver container."
    smallest_change: "Remove DownloadUser only in the ephemeral, unprivileged resolver; retain read-only inputs and use the pinned ARM builder keyring for signature verification."
  - attempt: 3
    result: FAIL
    finding: "The first native offline plan used macOS-first stat syntax; GNU stat -f returned filesystem information rather than package size."
    smallest_change: "Use GNU stat -c first with a macOS stat -f fallback."
  - attempt: 4
    result: PASS
    finding: "The content-pinned native plan validated all package/signature pairs without repository or target writes."
  - attempt: 5
    result: FAIL
    finding: "The integration cache did not contain a convenience copy of transaction.lock."
    smallest_change: "Mount the committed transaction lock explicitly; do not infer it from cache contents."
  - attempt: 6
    result: FAIL
    finding: "Copying the complete package cache into the target exhausted the 226 MiB then available in Docker."
    smallest_change: "Bind only the locked package payloads into the target cache for the duration of Pacman."
  - attempt: 7
    result: FAIL
    finding: "Exposing detached signatures inside the target cache caused Pacman to require target trust initialization."
    smallest_change: "Verify signatures with the pinned builder keyring before apply, then expose only content-locked package payloads to the offline target."
  - attempt: 8
    result: FAIL
    finding: "The first package-only bind cleanup used non-recursive unmount and left nested binds, returning status 1 after an otherwise valid transaction."
    smallest_change: "Use recursive unmount for the bounded package bind tree and verify cleanup."
  - attempt: 9
    result: PASS
    finding: "The native ARM64 offline transaction completed and preserved all lower-layer state."
limits:
  - The package cache is local build input and is not committed to Git.
  - Exact packages can disappear from the upstream mirror; archive them before discarding the retained local cache.
  - The transaction was applied only to a disposable off-target ARM64 clone. It has not been applied to live CM5 hardware because V3D/V3DV and Hyprland gates remain open.
  - Package signatures are verified while creating the cache; offline apply relies on the committed payload hashes and does not initialize target Pacman trust state.
